<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeApi - Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Pokemon Explorer</h1>
            <div class="buscador">
                <input type="text" id="pokemon-input" placeholder="Introduce el nombre del Pokemon...">
                <button id="buscar-btn">Buscar</button>
            </div>
        </div>
    </header>

    <main>
        <div class="contenido">
            <section id="status-message"></section>
            <section id="pokemon-container">
                <!-- Pokemon list will be populated here -->
            </section>
        </div>
    </main>

    <footer>
        <p>2026 Pokemon Explorer. Todos los derechos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
