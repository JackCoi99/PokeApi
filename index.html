<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon Explorer</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">

            <h1>Pokemon Explorer</h1>

            <div class="buscador">
                <input
                    type="text"
                    id="pokemon-input"
                    placeholder="Introduce el nombre o ID del Pokémon..."
                >

                <button id="buscar-btn">
                    Buscar
                </button>
            </div>

        </div>
    </header>

    <main>

        <div class="contenido">

            <section id="status-message"></section>

            <section id="pokemon-container">
                <!-- Los Pokémon aparecerán aquí -->
            </section>

        </div>

    </main>

    <footer>
        <p>2026 Pokemon Explorer. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
